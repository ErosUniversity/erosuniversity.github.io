<style>
:root{--ink:#121619;--card:#1a1f23;--line:#2a3136;--text:#f5f5f7;--muted:#a3a8ad;--dim:#7c848a;--teal:#63d3ca;--red:#e0857c;
  --sans:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ink);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body.checking .gate{visibility:hidden}
.gate{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:32px clamp(16px,6vw,72px)}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.top,.foot{display:flex;justify-content:space-between;gap:16px}
.foot{border-top:1px solid var(--line);padding-top:20px}
main{align-self:center;width:min(560px,100%);padding:48px 0}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--teal);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #63d3ca66}50%{box-shadow:0 0 0 12px #63d3ca00}}
svg.logo{display:block;width:min(360px,80vw);height:auto;margin:18px 0 0 -18px;overflow:visible;color:var(--text);cursor:pointer}
.sh{color:var(--teal);opacity:0;transition:opacity .25s ease,color .48s ease;transform-box:fill-box;transform-origin:center}
.sh.left{opacity:1}.sh.ink{color:var(--text)}
.horn{transition:opacity .2s ease}
h1{font-size:clamp(34px,6vw,54px);font-weight:500;letter-spacing:-.04em;line-height:1.05;margin:26px 0 12px}
h1 span{color:var(--teal)}
p{color:var(--muted);font-size:17px;line-height:1.5;margin:0 0 34px}
form{display:flex;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px;transition:border-color .2s,box-shadow .2s}
form:focus-within{border-color:#4a555c;box-shadow:0 0 0 1px #63d3ca22}
input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font:16px var(--mono);letter-spacing:.06em;padding:12px 12px}
input::placeholder{color:#5f686e}
button{border:1px solid var(--teal);background:var(--teal);color:#121619;border-radius:4px;padding:0 20px;font:600 14px var(--sans);cursor:pointer;white-space:nowrap}
button:disabled{opacity:.5;cursor:wait}
button:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.msg{min-height:22px;margin-top:14px;font:12px var(--mono);letter-spacing:.08em;color:var(--dim)}
.msg.bad{color:var(--red)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.dot,.shake{animation:none}}
</style>
</head>

<div class="gate">
  <div class="top"><span class="mono">Restricted · Brand presentation 2026</span><span class="mono">Berlin · B2B SaaS</span></div>

    <svg class="logo" id="logo" viewBox="-56 -20 112 40" role="img" aria-label="unc">
      <g fill="none" stroke="currentColor" stroke-width="4.5" stroke-linejoin="round">
        <g class="sh"><path d="M-22 -12 L-26.2 -12 A14 14 0 1 1 -45.8 -12 L-50 -12"/></g>
        <g class="sh"><path d="M-12 12 L-7.8 12 A14 14 0 1 1 11.8 12 L16 12"/></g>
        <g class="sh"><path d="M50 14 L50 9.8 A14 14 0 1 1 50 -9.8 L50 -14"/></g>
        <g class="hop"><g class="horn"><path d="M14 -10 L9.8 -10 A14 14 0 1 1 -9.8 -10 L-14 -10"/></g></g>
      </g>
    </svg>
    <h1>Ask your unc<span>.</span></h1>
    <p>Unc knows where the money went. Unc just needs the password first.</p>
    <form id="form" autocomplete="off">
      <input id="pw" type="password" placeholder="password" aria-label="Password" autofocus>
      <button id="go" type="submit">Enter →</button>
    </form>
    <div class="msg" id="msg" role="status"></div>
  </main>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const store = 'unc-key-' + D.salt;

async function reveal(key) {
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(D.iv) }, key, b64(D.data)));
  // Writing before the gate page has finished loading would merge both pages, so wait for load first.
  if (document.readyState !== 'complete') await new Promise(r => addEventListener('load', r, { once: true }));
  return () => { document.open(); document.write(html); document.close(); };
}

// Rolling logo, as in the workspace loader (brand.js): the u taps three times, rolls into the n and
// the c leaving teal shadows, the shadows turn white, then u, n, c pop one after another.
function roll() {
  const logo = document.getElementById('logo');
  const shadows = logo.querySelectorAll('.sh'), hop = logo.querySelector('.hop'), horn = logo.querySelector('.horn');
  const BEATS = [0, 220, 440, 810, 1410, 2010, 2750, 2970, 3190], LONG = 480, END = 3450;
  const SPOTS = [[-36, -2, 0], [2, 2, 180], [40, 0, 450]];
  const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const place = ([x, y, a]) => horn.setAttribute('transform', `translate(${x} ${y}) rotate(${a})`);
  const between = (a, b, k) => a.map((v, i) => v + (b[i] - v) * ease(k));
  const ink = () => shadows.forEach(sh => sh.classList.add('left', 'ink'));
  shadows.forEach(sh => sh.classList.remove('left', 'ink'));
  horn.style.opacity = 1;
  place(SPOTS[0]);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { ink(); horn.style.opacity = 0; return; }
  const start = performance.now() + 300;
  let fired = 0;
  const frame = now => {
    const t = now - start;
    while (fired < BEATS.length && t >= BEATS[fired]) {
      const i = fired++;
      if (i < 3) hop.animate([{ transform: 'none' }, { transform: 'translateY(-4px)' }, { transform: 'none' }], { duration: 160, easing: 'ease-out' });
      else if (i === 5) ink();
      else if (i > 5) shadows[i - 6].animate([{ transform: 'none' }, { transform: 'scale(1.18)' }, { transform: 'none' }], { duration: 200, easing: 'ease-out' });
    }
    const [r1, r2] = [BEATS[3], BEATS[4]];
    if (t < r1) place(SPOTS[0]);
    else if (t < r1 + LONG) place(between(SPOTS[0], SPOTS[1], (t - r1) / LONG));
    else if (t < r2) place(SPOTS[1]);
    else if (t < r2 + LONG) place(between(SPOTS[1], SPOTS[2], (t - r2) / LONG));
    else place(SPOTS[2]);
    if (t >= r1) shadows[0].classList.add('left');
    if (t >= r2) shadows[1].classList.add('left');
    if (t >= BEATS[5] + LONG) horn.style.opacity = 0;
    if (t < END) requestAnimationFrame(frame);
    else { ink(); horn.style.opacity = 0; }
  };
  requestAnimationFrame(frame);
}
document.getElementById('logo').addEventListener('click', roll);

(async () => {
  try {
    const saved = localStorage.getItem(store);
    if (saved) {
      const key = await crypto.subtle.importKey('raw', b64(saved), 'AES-GCM', false, ['decrypt']);
      (await reveal(key))();
      return;
    }
  } catch (e) {}
  document.body.classList.remove('checking');
  document.getElementById('pw').focus();
  roll();
})();

const form = document.getElementById('form'), msg = document.getElementById('msg'), go = document.getElementById('go');
form.addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  if (!pw) return;
  go.disabled = true; msg.className = 'msg'; msg.textContent = 'Unc is thinking…';
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(D.salt), iterations: D.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    const show = await reveal(key);
    try { localStorage.setItem(store, toB64(await crypto.subtle.exportKey('raw', key))); } catch (e) {}
    msg.textContent = 'Welcome back.';
    show();
  } catch (err) {
    go.disabled = false;
    msg.className = 'msg bad'; msg.textContent = "Nice try. Unc doesn't know you.";
    form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
  }
});
})();
